<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${acao == 'novo'} ? 'Nova Pessoa' : 'Editar Pessoa'">Pessoa - Garagem</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <header>
        <h1>Garagem de Veículos</h1>
        <nav>
            <a th:href="@{/pessoas}">Pessoas</a>
        </nav>
    </header>

    <main>
        <h2 th:text="${acao == 'novo'} ? 'Nova Pessoa' : 'Editar Pessoa'">Pessoa</h2>

        <form th:action="${acao == 'novo'} ? @{/pessoas/novo} : @{/pessoas/{id}/editar(id=${pessoa.id})}"
              th:object="${pessoa}" method="post">

            <div class="form-group">
                <label for="nome">Nome *</label>
                <input type="text" id="nome" th:field="*{nome}" placeholder="Nome completo">
                <span class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
            </div>

            <div class="form-group">
                <label for="cpf">CPF *</label>
                <input type="text" id="cpf" th:field="*{cpf}" placeholder="000.000.000-00">
                <span class="error" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></span>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" th:field="*{email}" placeholder="exemplo@email.com">
                <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" th:field="*{telefone}" placeholder="(00) 00000-0000">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a th:href="@{/pessoas}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
