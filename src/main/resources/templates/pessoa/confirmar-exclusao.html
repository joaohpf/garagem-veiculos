<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Exclusão - Garagem</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <header>
        <h1>Garagem de Veículos</h1>
        <nav>
            <a th:href="@{/pessoas}">Pessoas</a>
        </nav>
    </header>

    <main>
        <div class="confirm-box">
            <h2>Confirmar Exclusão</h2>
            <p>Deseja realmente excluir a pessoa <strong th:text="${pessoa.nome}"></strong>?</p>
            <p class="text-muted">CPF: <span th:text="${pessoa.cpf}"></span></p>

            <div class="form-actions">
                <form th:action="@{/pessoas/{id}/excluir(id=${pessoa.id})}" method="post">
                    <button type="submit" class="btn btn-danger">Sim, excluir</button>
                </form>
                <a th:href="@{/pessoas}" class="btn btn-secondary">Cancelar</a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
