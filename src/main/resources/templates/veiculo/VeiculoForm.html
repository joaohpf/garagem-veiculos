<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${acao == 'novo'} ? 'Novo Veículo - Garagem' : 'Editar Veículo - Garagem'">Veículo - Garagem de Veículos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Cabeçalho Institucional & Navegação -->
    <header>
        <div class="container header-inner">
            <a th:href="@{/}" class="brand" aria-label="Página Inicial - Garagem de Veículos">
                <div class="brand-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 10.9 2 11.2 2 11.5V16c0 .6.4 1 1 1h2"/>
                        <circle cx="7" cy="17" r="2"/>
                        <path d="M9 17h6"/>
                        <circle cx="17" cy="17" r="2"/>
                    </svg>
                </div>
                <div class="brand-info">
                    <span class="brand-title">Garagem de Veículos</span>
                    <span class="brand-subtitle">Gestão Acadêmica de Frota • ESW430</span>
                </div>
            </a>
            <nav aria-label="Navegação principal">
                <a th:href="@{/}" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    Reservas
                </a>
                <a th:href="@{/pessoas}" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    Pessoas
                </a>
                <a th:href="@{/veiculos}" class="nav-link active" aria-current="page">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="1" y="3" width="15" height="13"/>
                        <polygon points="16 8 20 8 23 11 23 16 16 16 8"/>
                        <circle cx="5.5" cy="18.5" r="2.5"/>
                        <circle cx="18.5" cy="18.5" r="2.5"/>
                    </svg>
                    Veículos
                </a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Notificação de Sucesso -->
        <div th:if="${sucesso}" class="alert alert-success" role="alert">
            <div class="alert-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
            </div>
            <div th:text="${sucesso}">Operação realizada com sucesso!</div>
        </div>

        <!-- Cabeçalho da Página -->
        <div class="page-header">
            <div class="page-header-title">
                <h2 th:text="${acao == 'novo'} ? 'Novo Veículo' : 'Editar Veículo'">Veículo</h2>
                <p th:text="${acao == 'novo'} ? 'Cadastre um novo veículo na frota com placa única e detalhes técnicos' : 'Atualize os dados e especificações do veículo selecionado'"></p>
            </div>
            <a th:href="@{/veiculos}" class="btn btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
                Voltar para lista
            </a>
        </div>

        <!-- Formulário em Card -->
        <div class="card" style="max-width: 720px; margin: 0 auto;">
            <div class="card-header">
                <div class="card-title-group">
                    <div class="card-icon" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="1" y="3" width="15" height="13"/>
                            <polygon points="16 8 20 8 23 11 23 16 16 8"/>
                            <circle cx="5.5" cy="18.5" r="2.5"/>
                            <circle cx="18.5" cy="18.5" r="2.5"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="card-title" th:text="${acao == 'novo'} ? 'Dados do Veículo' : 'Edição de Veículo'">Dados do Veículo</h3>
                        <p class="card-subtitle">Campos marcados com <span class="required" style="color: var(--color-danger); font-weight: 700;">*</span> são obrigatórios</p>
                    </div>
                </div>
            </div>

            <div class="card-body">
                <form method="post" th:object="${veiculo}"
                      th:action="${acao == 'novo'} ? @{/veiculos/novo} : @{/veiculos/{id}/editar(id=${veiculo.id})}">

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="placa">
                                Placa <span class="required" title="Campo obrigatório">*</span>
                            </label>
                            <input id="placa" type="text" th:field="*{placa}" placeholder="Ex: ABC1234 ou BRA2E19" autofocus>
                            <span class="error" th:errors="*{placa}"></span>
                        </div>

                        <div class="form-group">
                            <label for="marca">
                                Marca <span class="required" title="Campo obrigatório">*</span>
                            </label>
                            <input id="marca" type="text" th:field="*{marca}" placeholder="Ex: Fiat, Chevrolet, Toyota">
                            <span class="error" th:errors="*{marca}"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="modelo">
                            Modelo <span class="required" title="Campo obrigatório">*</span>
                        </label>
                        <input id="modelo" type="text" th:field="*{modelo}" placeholder="Ex: Argo Trekking, Onix, Corolla">
                        <span class="error" th:errors="*{modelo}"></span>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="ano">
                                Ano de Fabricação <span class="required" title="Campo obrigatório">*</span>
                            </label>
                            <input id="ano" type="number" th:field="*{ano}" placeholder="Ex: 2023" min="1900" max="2100">
                            <span class="error" th:errors="*{ano}"></span>
                        </div>

                        <div class="form-group">
                            <label for="cor">
                                Cor
                            </label>
                            <input id="cor" type="text" th:field="*{cor}" placeholder="Ex: Prata, Branco, Preto">
                            <span class="error" th:errors="*{cor}"></span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                                <polyline points="17 21 17 13 7 13 7 21"/>
                                <polyline points="7 3 7 8 15 8"/>
                            </svg>
                            Salvar
                        </button>
                        <a class="btn btn-secondary" th:href="@{/veiculos}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer>
        <div class="container footer-inner">
            <div>
                <strong>Garagem de Veículos</strong> • Sistema Acadêmico de Arquitetura de Software
            </div>
            <div>
                UniRV • ESW430
            </div>
        </div>
    </footer>
</body>
</html>
